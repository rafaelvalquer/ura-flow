name: Build Windows Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - feature/windows-desktop-build
    paths:
      - ".github/workflows/build-windows-desktop.yml"
      - "desktop/**"
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/build-windows-desktop.yml"
      - "desktop/**"
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"

permissions:
  contents: read

jobs:
  build-windows-installer:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install desktop dependencies
        run: npm --prefix desktop install --no-audit --no-fund

      - name: Build Windows installer
        run: npm run package:win

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "desktop/release" -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "O instalador .exe não foi criado em desktop/release."
          }
          Write-Host "Instalador gerado: $($installer.FullName)"
          Write-Host "Tamanho: $([math]::Round($installer.Length / 1MB, 2)) MB"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ura-flow-windows-installer
          path: desktop/release/*.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
